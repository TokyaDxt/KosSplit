name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang paket sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache

      - name: Pasang Buildozer
        run: pip install --upgrade pip setuptools wheel buildozer cython==0.29.36

      - name: Cache SDK, NDK, dan hasil build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK debug
        run: yes | buildozer -v android debug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: kossplit-apk
          path: bin/*.apk
